    <script>
      tinymce.init({ selector: 'textarea', telemetry: false });

const API_BASE_URL = 'https://balane-saspa-dental-1.onrender.com/patients';
let allPatients = [];
let filteredPatients = [];
let displayedPatients = [];
let currentSort = { column: 'name', direction: 'asc' };
const ITEMS_PER_PAGE = 10;
let currentPage = 1;

async function checkAuth() {
    try {
        const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/check-auth', { 
            credentials: 'include',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
        });
        const data = await response.json();
        if (!data.isLoggedIn || data.role !== 'admin') {
            Swal.fire({
                icon: 'error',
                title: 'Unauthorized',
                text: 'You are not authorized to access this page. Redirecting to login page.',
                confirmButtonColor: '#4154f1',
                allowOutsideClick: false
            }).then(() => {
                window.location.href = '/pages-login.html';
            });
            return false;
        }
        return true;
    } catch (error) {
        console.error('Auth check failed:', error);
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Authentication check failed. Redirecting to login page.',
            confirmButtonColor: '#4154f1'
        }).then(() => {
            window.location.href = '/pages-login.html';
        });
        return false;
    }
}

function initWebSocket() {
    const ws = new WebSocket('wss://balane-saspa-dental-1.onrender.com');
    ws.onopen = () => console.log('WebSocket connected');
    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleWebSocketMessage(message);
    };
    ws.onclose = () => {
        console.log('WebSocket disconnected. Reconnecting in 5s...');
        setTimeout(initWebSocket, 5000);
    };
    ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        Swal.fire({
            icon: 'warning',
            title: 'Connection Issue',
            text: 'WebSocket connection lost. Attempting to reconnect...',
            confirmButtonColor: '#4154f1',
            timer: 3000
        });
    };
}

async function handleWebSocketMessage(message) {
    console.log('Received WebSocket message:', message);
    switch (message.type) {
        case 'patient_added':
            allPatients.push(message.patient);
            filterPatients();
            Swal.fire({
                icon: 'success',
                title: 'Patient Added',
                text: `New patient ${message.patient.first_name} ${message.patient.last_name} added.`,
                confirmButtonColor: '#4154f1',
                timer: 3000
            });
            break;
        case 'patient_updated':
            const updateIndex = allPatients.findIndex(p => p.email === message.patient.email);
            if (updateIndex !== -1) {
                allPatients[updateIndex] = message.patient;
                filterPatients();
                Swal.fire({
                    icon: 'success',
                    title: 'Patient Updated',
                    text: `Patient ${message.patient.first_name} ${message.patient.last_name} updated.`,
                    confirmButtonColor: '#4154f1',
                    timer: 3000
                });
            } else {
                console.warn('Updated patient not found:', message.patient.email);
            }
            break;
        case 'patient_deleted':
            const deleteIndex = allPatients.findIndex(p => p.email === message.patient.email);
            if (deleteIndex !== -1) {
                const deletedPatient = allPatients.splice(deleteIndex, 1)[0];
                if (displayedPatients.length > filteredPatients.length) {
                    currentPage = Math.max(1, Math.ceil(filteredPatients.length / ITEMS_PER_PAGE));
                    displayedPatients = filteredPatients.slice(0, currentPage * ITEMS_PER_PAGE);
                }
                filterPatients();
                Swal.fire({
                    icon: 'info',
                    title: 'Patient Deleted',
                    text: `Patient ${deletedPatient.first_name} ${deletedPatient.last_name} removed.`,
                    confirmButtonColor: '#4154f1',
                    timer: 3000
                });
            } else {
                console.warn('Deleted patient not found:', message.patient.email);
            }
            break;
        case 'reject_response':
            console.log('Reject response:', message.reject_reason || 'N/A');
            break;
    }
}

async function apiRequest(endpoint, method = 'GET', data = null) {
    const options = {
        method,
        headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
        },
        credentials: 'include'
    };
    if (data) options.body = JSON.stringify(data);

    try {
        console.log(`Fetching: ${API_BASE_URL}${endpoint}`);
        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        const result = await response.json();
        console.log(`Received data:`, result);
        return result;
    } catch (error) {
        console.error(`API request failed for ${endpoint}:`, error);
        throw error;
    }
}

function sortPatients(patients, column, direction) {
    return patients.sort((a, b) => {
        let valueA, valueB;
        switch (column) {
            case 'name':
                valueA = `${a.first_name} ${a.last_name}`.toLowerCase();
                valueB = `${b.first_name} ${b.last_name}`.toLowerCase();
                break;
            case 'address':
                valueA = a.home_address.toLowerCase();
                valueB = b.home_address.toLowerCase();
                break;
            case 'sex':
                valueA = a.sex.toLowerCase();
                valueB = b.sex.toLowerCase();
                break;
            case 'age':
                valueA = parseInt(a.age);
                valueB = parseInt(b.age);
                break;
            case 'contact':
                valueA = a.mobile_no;
                valueB = b.mobile_no;
                break;
            case 'email':
                valueA = (a.email || '').toLowerCase();
                valueB = (b.email || '').toLowerCase();
                break;
            default:
                return 0;
        }
        return direction === 'asc' ? (valueA > valueB ? 1 : -1) : (valueA < valueB ? 1 : -1);
    });
}

function filterPatients() {
    const searchValue = document.getElementById('searchInput').value.toLowerCase();
    filteredPatients = allPatients.filter(patient =>
        `${patient.first_name} ${patient.last_name}`.toLowerCase().includes(searchValue) ||
        patient.home_address.toLowerCase().includes(searchValue) ||
        patient.sex.toLowerCase().includes(searchValue) ||
        patient.age.toString().includes(searchValue) ||
        patient.mobile_no.includes(searchValue) ||
        (patient.email || '').toLowerCase().includes(searchValue)
    );
    if (searchValue !== document.getElementById('searchInput').dataset.lastSearch) {
        currentPage = 1;
        displayedPatients = [];
        document.getElementById('searchInput').dataset.lastSearch = searchValue;
    }
    updateTable();
}

function updateTable() {
    const tableBody = document.querySelector("#patientTable tbody");
    tableBody.innerHTML = '';

    const sortedPatients = sortPatients([...filteredPatients], currentSort.column, currentSort.direction);
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const endIndex = startIndex + ITEMS_PER_PAGE;
    const patientsToAdd = sortedPatients.slice(startIndex, endIndex);

    displayedPatients = [...displayedPatients, ...patientsToAdd].slice(0, endIndex);

    if (displayedPatients.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = '<td colspan="6" class="text-center">No patients match the selected filters</td>';
        tableBody.appendChild(row);
    } else {
        displayedPatients.forEach(patient => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${patient.first_name} ${patient.last_name}</td>
                <td>${patient.home_address}</td>
                <td>${patient.sex}</td>
                <td>${patient.age}</td>
                <td>${patient.mobile_no}</td>
                <td>${patient.email || ''}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const loadLessBtn = document.getElementById('loadLessBtn');
    const allLoaded = displayedPatients.length >= sortedPatients.length;
    loadMoreBtn.style.display = allLoaded ? 'none' : 'inline-block';
    loadLessBtn.style.display = allLoaded && sortedPatients.length > ITEMS_PER_PAGE ? 'inline-block' : 'none';
}

function loadMorePatients() {
    currentPage++;
    updateTable();
}

function loadLessPatients() {
    currentPage = 1;
    displayedPatients = [];
    updateTable();
}

function exportToCSV() {
    const headers = [
        'First Name', 'Last Name', 'Middle Name', 'Birthdate', 'Sex', 'Age',
        'Nickname', 'Religion', 'Nationality', 'Home Address', 'Home No.',
        'Occupation', 'Office No.', 'Dental Insurance', 'Fax No.', 'Mobile No.',
        'Email', 'Effective Date'
    ];
    const rows = allPatients.map(patient => [
        `"${(patient.first_name || '').replace(/"/g, '""')}"`,
        `"${(patient.last_name || '').replace(/"/g, '""')}"`,
        `"${(patient.middle_name || '').replace(/"/g, '""')}"`,
        `"${(patient.birthdate || '').replace(/"/g, '""')}"`,
        patient.sex || '',
        patient.age || 0,
        `"${(patient.nickname || '').replace(/"/g, '""')}"`,
        `"${(patient.religion || '').replace(/"/g, '""')}"`,
        `"${(patient.nationality || '').replace(/"/g, '""')}"`,
        `"${(patient.home_address || '').replace(/"/g, '""')}"`,
        `"${(patient.home_no || '').replace(/"/g, '""')}"`,
        `"${(patient.occupation || '').replace(/"/g, '""')}"`,
        `"${(patient.office_no || '').replace(/"/g, '""')}"`,
        `"${(patient.dental_insurance || '').replace(/"/g, '""')}"`,
        `"${(patient.fax_no || '').replace(/"/g, '""')}"`,
        `"${(patient.mobile_no || '').replace(/"/g, '""')}"`,
        `"${(patient.email || '').replace(/"/g, '""')}"`,
        `"${(patient.effective_date || '').replace(/"/g, '""')}"`
    ].join(','));

    const csvContent = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `patients_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    Swal.fire({
        icon: 'success',
        title: 'Export Successful',
        text: `Patient data exported as patients_${new Date().toISOString().slice(0,10)}.csv`,
        confirmButtonColor: '#4154f1',
        timer: 1500
    });
}

async function loadPatients() {
    if (!(await checkAuth())) return;

    try {
        allPatients = await apiRequest('/allPatients');
        console.log('Fetched patients:', allPatients);
        filteredPatients = [...allPatients];
        updateTable();

        document.querySelectorAll('.sortable').forEach(header => {
            header.addEventListener('click', () => {
                const column = header.getAttribute('data-column');
                const sortIcon = header.querySelector('.sort-icon');
                currentSort.direction = (currentSort.column === column && currentSort.direction === 'asc') ? 'desc' : 'asc';
                currentSort.column = column;
                sortIcon.innerHTML = currentSort.direction === 'asc' ? '↑' : '↓';
                document.querySelectorAll('.sort-icon').forEach(icon => {
                    if (icon !== sortIcon) icon.innerHTML = '';
                });
                currentPage = 1;
                displayedPatients = [];
                updateTable();
            });
        });

        document.getElementById('searchInput').addEventListener('input', filterPatients);
        document.getElementById('exportCSV').addEventListener('click', exportToCSV);
        document.getElementById('loadMoreBtn').addEventListener('click', loadMorePatients);
        document.getElementById('loadLessBtn').addEventListener('click', loadLessPatients);

        document.getElementById('searchInput').dataset.lastSearch = '';
        initWebSocket();
    } catch (error) {
        console.error('Error loading patients:', error);
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: `Failed to load patients: ${error.message}`,
            confirmButtonColor: '#4154f1'
        });
    }
}

$(document).ready(() => {
    $('#head_content').load('header.html', (response, status, xhr) => {
        if (status === 'success') {
            console.log('Header loaded successfully in patients.html');

            const toggleSidebarBtn = document.querySelector('.toggle-sidebar-btn');
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            if (toggleSidebarBtn && sidebar && overlay) {
                toggleSidebarBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('active');
                    overlay.classList.toggle('active');
                    overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
                });

                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                    overlay.style.display = 'none';
                });
            } else {
                console.error('Sidebar toggle elements not found:', {
                    toggleSidebarBtn: !!toggleSidebarBtn,
                    sidebar: !!sidebar,
                    overlay: !!overlay
                });
            }

            const notificationDropdown = document.getElementById('notificationDropdown');
            const notificationsList = document.getElementById('notificationsList');

            if (notificationDropdown && notificationsList) {
                if (typeof bootstrap !== 'undefined') {
                    const dropdown = new bootstrap.Dropdown(notificationDropdown);
                    notificationDropdown.addEventListener('click', (e) => {
                        e.preventDefault();
                        dropdown.toggle();
                        console.log('Notification dropdown toggled');
                    });
                } else {
                    console.error('Bootstrap JS not loaded, using manual toggle for notification dropdown');
                    notificationDropdown.addEventListener('click', (e) => {
                        e.preventDefault();
                        notificationsList.classList.toggle('show');
                        console.log('Notification dropdown toggled manually');
                    });
                }
            }

            const profileDropdown = document.querySelector('.nav-link.nav-profile');
            const profileDropdownMenu = document.querySelector('.dropdown-menu.profile');

            if (profileDropdown && profileDropdownMenu) {
                if (typeof bootstrap !== 'undefined') {
                    const dropdown = new bootstrap.Dropdown(profileDropdown);
                    profileDropdown.addEventListener('click', (e) => {
                        e.preventDefault();
                        dropdown.toggle();
                        console.log('Profile dropdown toggled');
                    });
                } else {
                    console.error('Bootstrap JS not loaded, using manual toggle for profile dropdown');
                    profileDropdown.addEventListener('click', (e) => {
                        e.preventDefault();
                        profileDropdownMenu.classList.toggle('show');
                        console.log('Profile dropdown toggled manually');
                    });
                }
            }

            loadPatients();
        } else {
            console.error('Failed to load header:', xhr.status, xhr.statusText);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Failed to load header. Please try again later.',
                confirmButtonColor: '#4154f1'
            });
            $('#head_content').html('<p>Error loading header. Please try again later.</p>');
        }
    });

    $('#foot_content').load('footer.html', (response, status, xhr) => {
        if (status === 'success') {
            console.log('Footer loaded successfully');
        } else {
            console.error('Failed to load footer:', xhr.status, xhr.statusText);
        }
    });
});
