<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Dashboard</title>
  <meta content="Admin dashboard interface" name="description">
  <meta content="admin, dashboard, management" name="keywords">

  <link href="assets/img/icon.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #3b82f6;
      --secondary-color: #6b7280;
      --background-color: #f9fafb;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--background-color);
      color: var(--text-color);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1002;
      height: 64px;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
    }

    main {
      margin-top: 64px;
      padding: 1.5rem;
    }

    .toggle-sidebar-btn {
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--secondary-color);
      transition: all 0.2s ease;
      padding: 0.5rem;
      border-radius: 0.375rem;
    }

    .toggle-sidebar-btn:hover {
      color: var(--primary-color);
      background: rgba(59, 130, 246, 0.1);
    }

    .logo img {
      height: 36px;
      margin-right: 0.5rem;
    }

    .logo span {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-color);
    }

    .sidebar {
      background: var(--card-bg);
      width: 280px;
      height: 100%;
      position: fixed;
      top: 0;
      left: -280px;
      z-index: 1000;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-md);
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar .overlay {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100% - 64px);
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
      transition: opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar.active .overlay {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar .navmenu {
      padding: 1rem;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .sidebar .sidebar-nav {
      flex-grow: 1;
      margin-top: 1rem;
    }

    .sidebar .nav-item {
      margin-bottom: 0.25rem;
    }

    .sidebar .nav-link {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .sidebar .nav-link i {
      margin-right: 0.75rem;
      font-size: 1.25rem;
      color: var(--secondary-color);
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary-color);
    }

    .sidebar .nav-link:hover i,
    .sidebar .nav-link.active i {
      color: var(--primary-color);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1050;
      display: none;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.5rem;
      max-width: 600px;
      width: 90%;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.3s ease;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--secondary-color);
      transition: color 0.2s ease;
    }

    .close-modal:hover {
      color: var(--primary-color);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .approve-btn {
      background: #22c55e;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .approve-btn:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }

    .reject-btn {
      background: #ef4444;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .reject-btn:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .dropdown-menu {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      box-shadow: var(--shadow-md);
      min-width: 320px;
      max-height: 400px;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .nav-link.nav-icon {
      position: relative;
      padding: 0.5rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .nav-link.nav-icon:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .nav-link.nav-icon i {
      font-size: 1.25rem;
      color: var(--secondary-color);
    }

    .badge-number {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
    }

    .notification-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      animation: fadeIn 0.5s ease;
    }

    .notification-item:last-child {
      border-bottom: none;
    }

    .notification-item .btn-primary {
      background: var(--primary-color);
      border: none;
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .notification-item .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    @media (min-width: 1200px) {
      .sidebar {
        left: 0;
        background: var(--card-bg);
      }
      .toggle-sidebar-btn {
        display: none;
      }
      main {
        margin-left: 280px;
      }
      .sidebar .overlay {
        display: none;
      }
    }

    @media (max-width: 1199px) {
      .header-nav .nav-item:not(.dropdown) {
        display: none;
      }
      .dropdown-menu {
        right: 0;
        max-width: 360px;
      }
    }

    @media (max-width: 767px) {
      .header {
        height: 56px;
        padding: 0.5rem 1rem;
      }
      main {
        margin-top: 56px;
        padding: 1rem;
      }
      .logo img {
        height: 32px;
      }
      .toggle-sidebar-btn {
        font-size: 1.25rem;
      }
      .dropdown-menu {
        min-width: 280px;
      }
      .sidebar {
        width: 260px;
      }
      .sidebar .overlay {
        top: 56px;
        height: calc(100% - 56px);
      }
    }

    @media (max-width: 576px) {
      .header {
        height: 52px;
        padding: 0.5rem 0.75rem;
      }
      main {
        margin-top: 52px;
        padding: 0.75rem;
      }
      .logo img {
        height: 28px;
      }
      .dropdown-menu {
        min-width: 240px;
      }
      .sidebar {
        width: 240px;
      }
      .sidebar .overlay {
        top: 52px;
        height: calc(100% - 52px);
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header id="header" class="header d-flex align-items-center">
    <div class="d-flex align-items-center">
      <i class="bi bi-list toggle-sidebar-btn me-2"></i>
      <a href="index.html" class="logo d-flex align-items-center">
        <img src="assets/img/icon.png" alt="Admin Logo">
        <span>Admin</span>
      </a>
    </div>

    <nav class="header-nav ms-auto">
      <ul class="d-flex align-items-center">
        <li class="nav-item dropdown">
          <a class="nav-link nav-icon" href="#" data-bs-toggle="dropdown" id="notificationDropdown">
            <i class="bi bi-bell"></i>
            <span class="badge bg-primary badge-number" id="notificationCount">0</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow notifications" id="notificationsList">
            <li class="dropdown-header d-flex justify-content-between align-items-center">
              <span><span id="notificationHeaderCount">0</span> Pending Requests</span>
              <a href="notification.html" class="badge rounded-pill bg-primary p-2">View all</a>
            </li>
            <li class="items-container">
              <hr class="dropdown-divider">
            </li>
            <li class="dropdown-footer">
              <a href="notification.html">Show all notifications</a>
            </li>
          </ul>
        </li>

        <li class="nav-item dropdown pe-3">
          <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-2"></i>
            <span class="d-none d-md-block dropdown-toggle ps-2">Menu</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
            <li><a class="dropdown-item d-flex align-items-center" href="setting.html"><i class="bi bi-person"></i><span>Account</span></a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item d-flex align-items-center" href="/logout" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Sign Out</span></a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <div class="modal" id="actionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Process Request</h3>
        <button class="close-modal" onclick="closeActionModal()">×</button>
      </div>
      <div id="requestDetails" class="p-3"></div>
      <div class="button-group">
        <button class="approve-btn btn btn-success" onclick="acceptRequest()">Approve</button>
        <button class="reject-btn btn btn-danger" onclick="rejectRequest()">Reject</button>
      </div>
    </div>
  </div>

  <aside id="sidebar" class="sidebar">
    <div class="overlay"></div>
    <nav id="navmenu" class="navmenu">
      <ul class="sidebar-nav" id="sidebar-nav">
        <li class="nav-item"><a class="nav-link collapsed" href="index.html"><i class="bi bi-grid"></i><span>Dashboard</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="appointment.html"><i class="bi bi-calendar-check"></i><span>Appointment</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="patients.html"><i class="bi bi-person"></i><span>Patients</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="notification.html"><i class="bi bi-bell"></i><span>Requests</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="history.html"><i class="bi bi-clock-history"></i><span>History</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="services.html"><i class="bi bi-gear"></i><span>Services</span></a></li>
        <li class="nav-item"><a class="nav-link collapsed" href="setting.html"><i class="bi bi-person-circle"></i><span>Account</span></a></li>
      </ul>
    </nav>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
(function() {
  console.log('Header script loaded');

  let socket;
  let pendingRequests = [];
  let currentRequest = null;
  let pollingInterval = null;
  let consecutiveFetchFailures = 0;
  const MAX_CONSECUTIVE_FAILURES = 5;

  async function checkAuth() {
    try {
      const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/check-auth', {
        credentials: 'include',
        headers: { 
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': await getCsrfToken()
        }
      });
      const data = await response.json();
      if (!data.isLoggedIn || data.role !== 'admin') {
        Swal.fire({
          icon: 'error',
          title: 'Unauthorized',
          text: 'You are not authorized to access this page. Redirecting to login page.',
          confirmButtonColor: '#3b82f6',
          allowOutsideClick: false
        }).then(() => {
          window.location.href = '/pages-login.html';
        });
        return false;
      }
      return true;
    } catch (error) {
      console.error('Auth check failed:', error);
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Authentication check failed. Redirecting to login page.',
        confirmButtonColor: '#3b82f6'
      }).then(() => {
        window.location.href = '/pages-login.html';
      });
      return false;
    }
  }

  async function getCsrfToken() {
    try {
      const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/csrf-token', {
        credentials: 'include'
      });
      const data = await response.json();
      return data.csrfToken;
    } catch (error) {
      console.error('Error fetching CSRF token:', error);
      throw new Error('Failed to fetch CSRF token');
    }
  }

  function initializeSocketIO() {
    try {
      socket = io('https://balane-saspa-dental-1.onrender.com', {
        withCredentials: true,
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 5000,
        reconnectionDelayMax: 10000,
        randomizationFactor: 0.5
      });
      console.log('Attempting to connect to Socket.IO at https://balane-saspa-dental-1.onrender.com');
    } catch (error) {
      console.error('Socket.IO initialization failed:', error);
      startPolling();
      return;
    }

    socket.on('connect', () => {
      console.log('Socket.IO connection established');
      consecutiveFetchFailures = 0;
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        console.log('Polling stopped due to Socket.IO connection');
      }
      socket.emit('join', { userId: socket.userId });
    });

    socket.on('welcome', (data) => {
      console.log('Socket.IO welcome message:', data);
    });

    socket.on('cancel_request', (data) => {
      console.log('New cancel_request received via Socket.IO:', data);
      handleRequest(data);
    });

    socket.on('reschedule_request', (data) => {
      console.log('New reschedule_request received via Socket.IO:', data);
      handleRequest(data);
    });

    socket.on('cancel_response', (data) => {
      console.log('cancel_response received:', data);
      handleResponse(data);
    });

    socket.on('reschedule_response', (data) => {
      console.log('reschedule_response received:', data);
      handleResponse(data);
    });

    socket.on('reject_response', (data) => {
      console.log('reject_response received:', data);
      handleResponse(data);
    });

    socket.on('connect_error', (error) => {
      console.error('Socket.IO connection error:', error);
      startPolling();
    });

    socket.on('disconnect', (reason) => {
      console.log('Socket.IO disconnected:', reason);
      startPolling();
    });
  }

  function handleRequest(data) {
    const request = data.request;
    if (
      request.status === 'pending' &&
      !pendingRequests.some(req => req.id === request.id) &&
      !isExpired(request)
    ) {
      pendingRequests.push(request);
      updatePendingRequests();
      document.getElementById('notificationDropdown').click();
    }
  }

  function handleResponse(data) {
    pendingRequests = pendingRequests.filter(req => req.id !== data.requestId);
    updatePendingRequests();
    if (window.location.pathname.includes('index.html')) {
      window.location.reload();
    }
  }

  function startPolling() {
    if (!pollingInterval) {
      console.warn('Socket.IO not connected, falling back to polling...');
      pollingInterval = setInterval(() => {
        console.log('Polling for pending requests');
        fetchPendingRequests();
      }, 10000);
    }
  }

  function isExpired(request) {
    const appointmentDate = request.appointments?.appointment_date || request.new_appointment_date;
    if (!appointmentDate) return false;
    const now = new Date();
    const appointmentTime = new Date(appointmentDate);
    return appointmentTime < now;
  }

  $(document).ready(async () => {
    console.log('DOM loaded in header, initializing Socket.IO and notifications');
    if (!(await checkAuth())) return;
    initializeSidebarToggle();
    initializeSocketIO();
    fetchPendingRequests();

    setTimeout(() => {
      if (!socket || !socket.connected) {
        startPolling();
      }
    }, 1000);
  });

  function initializeSidebarToggle() {
    const toggleSidebarBtn = document.querySelector('.toggle-sidebar-btn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = sidebar ? sidebar.querySelector('.overlay') : null;

    if (!toggleSidebarBtn || !sidebar || !overlay) {
      console.error('Sidebar toggle elements not found');
      return;
    }

    toggleSidebarBtn.addEventListener('click', (e) => {
      e.preventDefault();
      sidebar.classList.toggle('active');
      document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    });

    overlay.addEventListener('click', (e) => {
      e.preventDefault();
      sidebar.classList.remove('active');
      document.body.style.overflow = '';
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1200 && sidebar.classList.contains('active')) {
        sidebar.classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  }

  function updatePendingRequests() {
    const count = document.getElementById('notificationCount');
    const headerCount = document.getElementById('notificationHeaderCount');
    const list = document.getElementById('notificationsList');
    const itemsContainer = list ? list.querySelector('.items-container') : null;

    if (!count || !headerCount || !list || !itemsContainer) {
      console.error('Notification elements not found');
      return;
    }

    pendingRequests = pendingRequests.filter(req => !isExpired(req));
    count.textContent = pendingRequests.length;
    headerCount.textContent = pendingRequests.length;

    const existingItems = itemsContainer.querySelectorAll('.notification-item');
    existingItems.forEach(item => item.remove());

    const existingDividers = itemsContainer.querySelectorAll('.dropdown-divider');
    existingDividers.forEach((divider, index) => {
      if (index > 0) divider.remove();
    });

    if (pendingRequests.length === 0) {
      const noItems = document.createElement('li');
      noItems.className = 'notification-item';
      noItems.textContent = 'No pending requests';
      itemsContainer.appendChild(noItems);
      itemsContainer.appendChild(document.createElement('hr')).className = 'dropdown-divider';
    } else {
      pendingRequests.forEach((request, index) => {
        const patientData = request.patients || {};
        const patientName = `${patientData.first_name || ''} ${patientData.last_name || ''}`.trim() || 'Unknown';
        const action = request.action || request.pending_action || 'Unknown';

        const item = document.createElement('li');
        item.className = 'notification-item';
        item.innerHTML = `
          <div>
            <h4 class="fw-semibold">${action.charAt(0).toUpperCase() + action.slice(1)} Request</h4>
            <p class="text-muted">${patientName}</p>
            <p class="text-muted">Current: ${request.appointments?.appointment_date ? new Date(request.appointments.appointment_date).toLocaleString() : 'N/A'}</p>
            ${action === 'reschedule' ? `<p class="text-muted">New: ${request.new_appointment_date ? new Date(request.new_appointment_date).toLocaleString() : 'N/A'}</p>` : ''}
            <p class="text-muted">Service: ${request.appointments?.services?.name || request.services?.name || 'N/A'}</p>
            <a href="#" class="btn btn-sm btn-primary" onclick="showActionModal(${index}); return false;">Review</a>
          </div>
        `;
        itemsContainer.appendChild(item);
        itemsContainer.appendChild(document.createElement('hr')).className = 'dropdown-divider';
      });
    }
  }

  function showActionModal(index) {
    currentRequest = pendingRequests[index];
    const patientData = currentRequest.patients || {};
    const patientName = `${patientData.first_name || ''} ${patientData.last_name || ''}`.trim() || 'Unknown';
    const action = currentRequest.action || currentRequest.pending_action || 'Unknown';

    const requestDetails = document.getElementById('requestDetails');
    if (requestDetails) {
      requestDetails.innerHTML = `
        <p><strong>${action.charAt(0).toUpperCase() + action.slice(1)} Request</strong></p>
        <p>Patient: ${patientName}</p>
        <p>Current Date: ${currentRequest.appointments?.appointment_date ? new Date(currentRequest.appointments.appointment_date).toLocaleString() : 'N/A'}</p>
        ${action === 'reschedule' ? `<p>New Date: ${currentRequest.new_appointment_date ? new Date(currentRequest.new_appointment_date).toLocaleString() : 'N/A'}</p>` : ''}
        ${action === 'reschedule' ? `<p>New Notes: ${currentRequest.new_notes || 'N/A'}</p>` : ''}
        ${action === 'cancel' ? `<p>Cancel Reason: ${currentRequest.cancel_reason || 'Not specified'}</p>` : ''}
        <p>Service: ${currentRequest.appointments?.services?.name || currentRequest.services?.name || 'N/A'}</p>
      `;
    }

    const actionModal = document.getElementById('actionModal');
    if (actionModal) {
      actionModal.style.display = 'none';
      actionModal.classList.remove('show');
      setTimeout(() => {
        actionModal.style.display = 'flex';
        actionModal.classList.add('show');
      }, 10);
    }

    const dropdownElement = document.getElementById('notificationDropdown');
    if (dropdownElement && bootstrap.Dropdown) {
      const dropdown = bootstrap.Dropdown.getInstance(dropdownElement);
      if (dropdown) {
        dropdown.hide();
      }
    }
  }

  function closeActionModal() {
    const actionModal = document.getElementById('actionModal');
    if (actionModal) {
      actionModal.style.display = 'none';
      actionModal.classList.remove('show');
    }
    currentRequest = null;
  }

  async function acceptRequest() {
    if (!currentRequest) return;
    try {
      const csrfToken = await getCsrfToken();
      const response = await fetch(`https://balane-saspa-dental-1.onrender.com/api/appointments/requests/${currentRequest.id}/approve`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': csrfToken
        },
        credentials: 'include'
      });
      if (response.ok) {
        pendingRequests = pendingRequests.filter(r => r.id !== currentRequest.id);
        updatePendingRequests();
        closeActionModal();
        if (socket && socket.connected) {
          socket.emit(`${currentRequest.action}_response`, {
            requestId: currentRequest.id,
            status: 'approved'
          });
        }
        Swal.fire({
          icon: 'success',
          title: 'Request Approved',
          text: `${currentRequest.action.charAt(0).toUpperCase() + currentRequest.action.slice(1)} request approved successfully!`,
          confirmButtonColor: '#3b82f6',
          timer: 2000
        });
        if (window.location.pathname.includes('index.html')) {
          window.location.reload();
        }
      } else {
        const error = await response.json();
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: `Failed to approve ${currentRequest.action} request: ${error.message}`,
          confirmButtonColor: '#3b82f6'
        });
      }
    } catch (error) {
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Error processing request',
        confirmButtonColor: '#3b82f6'
      });
    }
  }

  async function rejectRequest() {
    if (!currentRequest) return;
    try {
      const csrfToken = await getCsrfToken();
      const response = await fetch(`https://balane-saspa-dental-1.onrender.com/api/appointments/requests/${currentRequest.id}/reject`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': csrfToken
        },
        credentials: 'include'
      });
      if (response.ok) {
        pendingRequests = pendingRequests.filter(r => r.id !== currentRequest.id);
        updatePendingRequests();
        closeActionModal();
        if (socket && socket.connected) {
          socket.emit(`${currentRequest.action}_response`, {
            requestId: currentRequest.id,
            status: 'rejected'
          });
        }
        Swal.fire({
          icon: 'success',
          title: 'Request Rejected',
          text: `${currentRequest.action.charAt(0).toUpperCase() + currentRequest.action.slice(1)} request rejected successfully!`,
          confirmButtonColor: '#3b82f6',
          timer: 2000
        });
      } else {
        const error = await response.json();
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: `Failed to reject ${currentRequest.action} request: ${error.message}`,
          confirmButtonColor: '#3b82f6'
        });
      }
    } catch (error) {
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Error processing request',
        confirmButtonColor: '#3b82f6'
      });
    }
  }

  async function fetchPendingRequests() {
    try {
      const csrfToken = await getCsrfToken();
      const response = await fetch('https://balane-saspa-dental-1.onrender.com/api/appointments/requests', {
        credentials: 'include',
        headers: {
          'Accept': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': csrfToken
        }
      });
      if (response.ok) {
        const data = await response.json();
        pendingRequests = (data.requests || []).filter(req => 
          req.status === 'pending' && 
          !isExpired(req) &&
          req.status !== 'cancelled' &&
          req.status !== 'rejected'
        );
        updatePendingRequests();
        consecutiveFetchFailures = 0;
      } else {
        consecutiveFetchFailures++;
        if (consecutiveFetchFailures >= MAX_CONSECUTIVE_FAILURES) {
          clearInterval(pollingInterval);
          pollingInterval = null;
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Unable to fetch notifications due to repeated server errors. Please contact support.',
            confirmButtonColor: '#3b82f6'
          });
        }
      }
    } catch (error) {
      consecutiveFetchFailures++;
      if (consecutiveFetchFailures >= MAX_CONSECUTIVE_FAILURES) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Unable to fetch notifications due to repeated server errors. Please contact support.',
          confirmButtonColor: '#3b82f6'
        });
      }
    }
  }

  async function handleLogout() {
    try {
      const csrfToken = await getCsrfToken();
      const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/logout', {
        method: 'POST',
        credentials: 'include',
        headers: { 
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': csrfToken
        }
      });
      if (response.ok) {
        document.cookie.split(";").forEach(function(c) {
          const cookieName = c.trim().split('=')[0];
          document.cookie = `${cookieName}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax`;
        });
        localStorage.clear();
        sessionStorage.clear();
        window.location.replace('/pages-login.html');
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Logout failed. Please try again.',
          confirmButtonColor: '#3b82f6'
        });
      }
    } catch (err) {
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'An error occurred during logout.',
        confirmButtonColor: '#3b82f6'
      });
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', function(e) {
    e.preventDefault();
    Swal.fire({
      title: 'Are you sure?',
      text: 'Do you want to sign out of your account?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3b82f6',
      cancelButtonColor: '#ef4444',
      confirmButtonText: 'Yes, sign out',
      cancelButtonText: 'Cancel'
    }).then((result) => {
      if (result.isConfirmed) {
        handleLogout();
      }
    });
  });
})();
  </script>
