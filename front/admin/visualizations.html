<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin - Appointment Visualizations</title>
  <meta content="Interactive visualizations for appointment status and service popularity" name="description">
  <meta content="appointments, visualizations, admin, dashboard" name="keywords">
  <link href="assets/img/icon.png" rel="icon">
  <link href="assets/img/icon.png" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <style>
    .legend-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .legend-item:hover {
      background: #e6f3ff;
      transform: translateY(-2px);
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 0.5rem;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
    }
    .legend-item.hidden {
      opacity: 0.6;
      background: #f0f0f0;
    }
    .loading-spinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4A90E2;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .canvas-container {
      position: relative;
      width: 100%;
      min-height: 300px;
    }
    #statusChart, #serviceChart {
      width: 100% !important;
      height: 300px !important;
    }
    @media (max-width: 768px) {
      .canvas-container {
        min-height: 200px;
      }
      #statusChart, #serviceChart {
        height: 200px !important;
      }
      .legend-item {
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
      }
      .legend-color {
        width: 12px;
        height: 12px;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 font-nunito">
  <div id="head_content"></div>
  <main class="container mx-auto px-4 py-8">
    <div class="mb-6">
      <nav class="text-gray-600">
        <ol class="list-reset flex">
          <li><a href="index.html" class="text-blue-500 hover:underline">Dashboard</a></li>
          <li><span class="mx-2">/</span></li>
          <li><a href="appointments.html" class="text-blue-500 hover:underline">Appointments Graph</a></li>
          <li><span class="mx-2">/</span></li>
          <li class="text-gray-500">Visualizations</li>
        </ol>
      </nav>
      <h2 class="text-2xl font-bold text-gray-800">Appointment Visualizations</h2>
    </div>
    <section class="space-y-8">
      <div class="bg-white p-6 rounded-lg shadow-lg">
        <div class="loading-spinner" id="pieChartSpinner"></div>
        <div class="flex flex-wrap items-center gap-4 mb-4">
          <label for="statusYearFilter" class="font-medium text-gray-700">Year:</label>
          <select id="statusYearFilter" class="p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none" aria-label="Select year for status chart"></select>
          <button id="exportStatusCsvBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:ring-2 focus:ring-blue-300 focus:outline-none" aria-label="Export status chart data as CSV">Export Status Data as CSV</button>
        </div>
        <div id="statusChartLegend" class="flex flex-wrap gap-2 mb-4"></div>
        <div class="canvas-container">
          <canvas id="statusChart" aria-label="Pie chart showing appointment status distribution"></canvas>
        </div>
        <p class="mt-4 text-lg font-semibold text-blue-500" id="statusHighlightText"></p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-lg">
        <div class="loading-spinner" id="barChartSpinner"></div>
        <div class="flex flex-wrap items-center gap-4 mb-4">
          <label for="serviceYearFilter" class="font-medium text-gray-700">Year:</label>
          <select id="serviceYearFilter" class="p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none" aria-label="Select year for service chart"></select>
          <button id="exportServiceCsvBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:ring-2 focus:ring-blue-300 focus:outline-none" aria-label="Export service chart data as CSV">Export Service Data as CSV</button>
        </div>
        <div id="serviceChartLegend" class="flex flex-wrap gap-2 mb-4"></div>
        <div class="canvas-container">
          <canvas id="serviceChart" aria-label="Bar chart showing service popularity"></canvas>

      </div>
    </section>
  </main>

    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
  </a>
  <script src="assets/js/main.js"></script>
  <script>
$(document).ready(() => {
  $('#head_content').load('header.html', (response, status, xhr) => {
    if (status === 'success') {
      console.log('Header loaded successfully in visualizations.html');
      initSidebarToggle();
      initDropdowns();
    } else {
      console.error('Failed to load header:', xhr.status, xhr.statusText);
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Failed to load header. Please try again later.',
        confirmButtonColor: '#4A90E2'
      });
      $('#head_content').html('<p>Error loading header. Please try again later.</p>');
    }
  });
  $('#foot_content').load('footer.html', (response, status, xhr) => {
    if (status === 'success') {
      console.log('Footer loaded successfully');
    } else {
      console.error('Failed to load footer:', xhr.status, xhr.statusText);
    }
  });
});

function initSidebarToggle() {
  const toggleSidebarBtn = document.querySelector('.toggle-sidebar-btn');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (toggleSidebarBtn && sidebar && overlay) {
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      overlay.style.display = 'none';
    });
  } else {
    console.error('Sidebar toggle elements not found:', {
      toggleSidebarBtn: !!toggleSidebarBtn,
      sidebar: !!sidebar,
      overlay: !!overlay
    });
  }
}

function initDropdowns() {
  const notificationDropdown = document.getElementById('notificationDropdown');
  const notificationsList = document.getElementById('notificationsList');
  const profileDropdown = document.querySelector('.nav-link.nav-profile');
  const profileDropdownMenu = document.querySelector('.dropdown-menu.profile');
  if (notificationDropdown && notificationsList) {
    notificationDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      notificationsList.classList.toggle('show');
      console.log('Notification dropdown toggled manually');
    });
  }
  if (profileDropdown && profileDropdownMenu) {
    profileDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      profileDropdownMenu.classList.toggle('show');
      console.log('Profile dropdown toggled manually');
    });
  }
}

let statusChartInstance = null;
let serviceChartInstance = null;
let allAppointments = [];
let allServices = [];

document.addEventListener('DOMContentLoaded', async () => {
  const spinners = [
    document.getElementById('pieChartSpinner'),
    document.getElementById('barChartSpinner')
  ];
  spinners.forEach(spinner => spinner && (spinner.style.display = 'block'));

  function testChart() {
    const testCanvas = document.createElement('canvas');
    testCanvas.id = 'testChart';
    testCanvas.style.display = 'none';
    document.body.appendChild(testCanvas);
    try {
      new Chart(testCanvas.getContext('2d'), {
        type: 'pie',
        data: {
          labels: ['Test'],
          datasets: [{ data: [1] }]
        }
      });
      console.log('Test chart rendered successfully');
      document.body.removeChild(testCanvas);
    } catch (error) {
      console.error('Test chart failed:', error);
      Swal.fire({
        icon: 'error',
        title: 'Chart Error',
        text: 'Failed to initialize Chart.js: ' + error.message,
        confirmButtonColor: '#4A90E2'
      });
    }
  }
  testChart();

  let socket;
  function initSocketIO() {
    socket = io('https://balane-saspa-dental-1.onrender.com', {
      withCredentials: true,
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 5000,
      reconnectionDelayMax: 10000,
      randomizationFactor: 0.5
    });
    socket.on('connect', () => {
      console.log('Socket.IO connected');
      socket.emit('join', { userId: socket.userId });
    });
    socket.on('welcome', (data) => {
      console.log('Socket.IO welcome message:', data);
    });
    socket.on('reschedule_request', (message) => {
      console.log('Received Socket.IO reschedule_request:', message);
      handleSocketIOMessage(message);
    });
    socket.on('cancel_request', (message) => {
      console.log('Received Socket.IO cancel_request:', message);
      handleSocketIOMessage(message);
    });
    socket.on('confirm_response', (message) => {
      console.log('Received Socket.IO confirm_response:', message);
      handleSocketIOMessage(message);
    });
    socket.on('reschedule_response', (message) => {
      console.log('Received Socket.IO reschedule_response:', message);
      handleSocketIOMessage(message);
    });
    socket.on('reject_response', (message) => {
      console.log('Received Socket.IO reject_response:', message);
      handleSocketIOMessage(message);
    });
    socket.on('service_added', (message) => {
      console.log('Received Socket.IO service_added:', message);
      handleSocketIOMessage(message);
    });
    socket.on('connect_error', (error) => {
      console.error('Socket.IO error:', error);
      setTimeout(initSocketIO, 5000);
    });
    socket.on('disconnect', () => {
      console.log('Socket.IO disconnected. Reconnecting in 5s...');
      setTimeout(initSocketIO, 5000);
    });
  }
  initSocketIO();

  async function handleSocketIOMessage(message) {
    console.log('Processing Socket.IO message:', message);
    const statusYearFilter = document.getElementById('statusYearFilter');
    const serviceYearFilter = document.getElementById('serviceYearFilter');
    const currentStatusYear = parseInt(statusYearFilter.value);
    const currentServiceYear = parseInt(serviceYearFilter.value);
    switch (message.type) {
      case 'reschedule_request':
      case 'cancel_request':
        Swal.fire({
          icon: 'info',
          title: `${message.type === 'reschedule_request' ? 'Reschedule' : 'Cancel'} Request`,
          text: `New ${message.type === 'reschedule_request' ? 'reschedule' : 'cancel'} request for ${getPatientName(message.request.patients)}.`,
          confirmButtonColor: '#4A90E2',
          timer: 3000
        });
        break;
      case 'confirm_response':
      case 'reschedule_response':
      case 'cancel_response':
      case 'reject_response':
        const appointmentId = message.request.appointment_id || message.requestId;
        const appointmentIndex = allAppointments.findIndex(app => app.id === appointmentId);
        if (appointmentIndex !== -1) {
          const appointment = allAppointments[appointmentIndex];
          if (message.type === 'confirm_response' && message.status === 'approved') {
            appointment.status = 'confirmed';
            appointment.pending_action = null;
          } else if (message.type === 'reschedule_response' && message.status === 'approved') {
            appointment.appointment_date = message.request.new_appointment_date;
            appointment.status = 'confirmed';
            appointment.pending_action = null;
          } else if (message.type === 'cancel_response' && message.status === 'approved') {
            appointment.status = 'cancelled';
            appointment.pending_action = null;
          } else if (message.type === 'reject_response' && message.status === 'rejected') {
            appointment.status = 'rejected';
            appointment.reject_reason = message.reject_reason || 'N/A';
            appointment.pending_action = null;
          }
          allAppointments[appointmentIndex] = appointment;
          renderStatusChart(allAppointments, currentStatusYear);
          renderServiceChart(allAppointments, allServices, currentServiceYear);
          Swal.fire({
            icon: message.status === 'approved' ? 'success' : 'error',
            title: `${message.type.replace('_response', '').capitalize()} ${message.status.capitalize()}`,
            text: `Appointment ${message.status} for ${getPatientName(appointment.patients)}.`,
            confirmButtonColor: '#4A90E2',
            timer: 3000
          });
        }
        break;
      case 'service_added':
        const newService = message.service;
        if (!allServices.some(s => s.name === newService.name)) {
          allServices.push(newService);
          renderServiceChart(allAppointments, allServices, currentServiceYear);
          Swal.fire({
            icon: 'info',
            title: 'New Service',
            text: `Service "${newService.name}" added.`,
            confirmButtonColor: '#4A90E2',
            timer: 3000
          });
        }
        break;
    }
  }

  String.prototype.capitalize = function() {
    return this.length > 0 ? this.charAt(0).toUpperCase() + this.slice(1) : this;
  };

  try {
    const authResponse = await fetch('https://balane-saspa-dental-1.onrender.com/auth/check-auth', {
      credentials: 'include',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
        'CSRF-Token': await getCsrfToken()
      }
    });
    if (!authResponse.ok) {
      const errorData = await authResponse.json();
      throw new Error(errorData.message || 'Authentication check failed');
    }
    const authData = await authResponse.json();
    if (!authData.isLoggedIn || authData.role !== 'admin') {
      Swal.fire({
        icon: 'error',
        title: 'Unauthorized',
        text: 'You are not authorized to access this page. Redirecting to login page.',
        confirmButtonColor: '#4A90E2',
        allowOutsideClick: false
      }).then(() => {
        window.location.href = '/pages-login.html';
      });
      return;
    }

    const appointmentsResponse = await fetch('https://balane-saspa-dental-1.onrender.com/api/appointments/all', {
      credentials: 'include',
      headers: {
        'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
        'CSRF-Token': await getCsrfToken()
      }
    });
    if (!appointmentsResponse.ok) throw new Error(`Failed to fetch appointments: ${appointmentsResponse.status}`);
    const appointmentsData = await appointmentsResponse.json();
    if (!appointmentsData.success) throw new Error(appointmentsData.message);
    allAppointments = appointmentsData.appointments;
    console.log('Appointments loaded:', allAppointments);

    try {
      const servicesResponse = await fetch('https://balane-saspa-dental-1.onrender.com/api/services/all', {
        credentials: 'include',
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('authToken'),
          'CSRF-Token': await getCsrfToken()
        }
      });
      if (!servicesResponse.ok) throw new Error(`Failed to fetch services: ${servicesResponse.status}`);
      const servicesData = await servicesResponse.json();
      if (!servicesData.success) throw new Error(servicesData.message);
      allServices = servicesData.services;
    } catch (error) {
      console.error('Error fetching services:', error);
      Swal.fire({
        icon: 'warning',
        title: 'Service Fetch Failed',
        text: 'Could not load services. Using appointment data as fallback.',
        confirmButtonColor: '#4A90E2'
      });
      const uniqueServices = [...new Set(allAppointments.map(app => app.services?.name).filter(name => name))];
      allServices = uniqueServices.map(name => ({ name }));
    }
    console.log('Services loaded:', allServices);

    const invalidAppointments = allAppointments.filter(app => isNaN(new Date(app.appointment_date).getTime()));
    if (invalidAppointments.length > 0) {
      console.warn('Invalid appointment dates:', invalidAppointments);
      Swal.fire({
        icon: 'warning',
        title: 'Invalid Data',
        text: `${invalidAppointments.length} appointment(s) have invalid dates and will be excluded from the charts.`,
        confirmButtonColor: '#4A90E2'
      });
      allAppointments = allAppointments.filter(app => !isNaN(new Date(app.appointment_date).getTime()));
    }

    if (allAppointments.length === 0) {
      Swal.fire({
        icon: 'info',
        title: 'No Appointments',
        text: 'No appointment data available to display.',
        confirmButtonColor: '#4A90E2'
      });
      document.getElementById('statusHighlightText').textContent = 'No appointment data available.';
      document.getElementById('serviceHighlightText').textContent = 'No appointment data available.';
      spinners.forEach(spinner => spinner && (spinner.style.display = 'none'));
      return;
    }

    const currentYear = new Date().getFullYear();
    populateYearFilter(allAppointments, currentYear);
    requestAnimationFrame(() => {
      renderStatusChart(allAppointments, currentYear);
      renderServiceChart(allAppointments, allServices, currentYear);
    });

    document.getElementById('statusYearFilter').addEventListener('change', (e) => {
      renderStatusChart(allAppointments, parseInt(e.target.value));
    });
    document.getElementById('exportStatusCsvBtn').addEventListener('click', () => {
      exportStatusToCsv(allAppointments, parseInt(document.getElementById('statusYearFilter').value));
    });
    document.getElementById('serviceYearFilter').addEventListener('change', (e) => {
      renderServiceChart(allAppointments, allServices, parseInt(e.target.value));
    });
    document.getElementById('exportServiceCsvBtn').addEventListener('click', () => {
      exportServiceToCsv(allAppointments, parseInt(document.getElementById('serviceYearFilter').value));
    });

    spinners.forEach(spinner => spinner && (spinner.style.display = 'none'));
  } catch (error) {
    console.error('Error loading data:', error);
    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: `Failed to load data: ${error.message}`,
      confirmButtonColor: '#4A90E2'
    });
    document.getElementById('statusHighlightText').textContent = 'Failed to load appointment data.';
    document.getElementById('serviceHighlightText').textContent = 'Failed to load appointment data.';
    spinners.forEach(spinner => spinner && (spinner.style.display = 'none'));
  }
});

async function getCsrfToken() {
  try {
    const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/csrf-token', {
      credentials: 'include'
    });
    const data = await response.json();
    return data.csrfToken;
  } catch (error) {
    console.error('Error fetching CSRF token:', error);
    throw new Error('Failed to fetch CSRF token');
  }
}

function getPatientName(patientData) {
  if (!patientData) return 'Unknown';
  const { first_name, middle_name, last_name } = patientData;
  return [first_name, middle_name, last_name].filter(Boolean).join(' ').trim() || 'Unknown';
}

function populateYearFilter(appointments, currentYear) {
  const yearFilters = [
    document.getElementById('statusYearFilter'),
    document.getElementById('serviceYearFilter')
  ];
  const years = [...new Set(appointments.map(app => new Date(app.appointment_date).getFullYear()))].sort((a, b) => b - a);
  yearFilters.forEach(filter => {
    if (filter) {
      filter.innerHTML = '';
      years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        filter.appendChild(option);
      });
      filter.value = currentYear;
    }
  });
}

function generateColor(index) {
  const colors = [
    '#2563eb', '#f97316', '#dc2626', '#14b8a6', '#9333ea', '#f59e0b', '#16a34a',
    '#db2777', '#eab308', '#3b82f6', '#4f46e5', '#a3e635', '#22c55e', '#ea580c',
    '#7c3aed', '#06b6d4', '#ec4899', '#ef4444', '#65a30d', '#0ea5e9'
  ];
  return colors[index % colors.length];
}

function renderStatusChart(appointments, year) {
  const spinner = document.getElementById('pieChartSpinner');
  spinner.style.display = 'block';
  try {
    const canvas = document.getElementById('statusChart');
    if (!canvas || !canvas.getContext('2d')) throw new Error('Canvas context not available');
    const statuses = ['confirmed', 'pending', 'cancelled', 'rejected'];
    const statusCounts = statuses.map(status => 
      appointments.filter(app => new Date(app.appointment_date).getFullYear() === year && app.status?.toLowerCase() === status).length
    );
    const total = statusCounts.reduce((sum, count) => sum + count, 0);
    const datasets = [{
      data: statusCounts,
      backgroundColor: ['#16a34a', '#f59e0b', '#ef4444', '#dc2626'],
      borderColor: '#fff',
      borderWidth: 2
    }];

    const maxCount = Math.max(...statusCounts);
    const dominantStatus = statuses[statusCounts.indexOf(maxCount)];

    if (statusChartInstance) statusChartInstance.destroy();
    statusChartInstance = new Chart(canvas.getContext('2d'), {
      type: 'pie',
      data: { labels: statuses.map(s => s.capitalize()), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          title: { 
            display: true, 
            text: `Appointment Status Distribution (${year})`, 
            font: { size: 18, weight: '600', family: 'Nunito' }, 
            color: '#333', 
            padding: { top: 10, bottom: 20 } 
          },
          tooltip: { 
            backgroundColor: '#fff', 
            titleColor: '#333', 
            bodyColor: '#666', 
            borderColor: '#e0e0e0', 
            borderWidth: 1, 
            cornerRadius: 8, 
            padding: 12 
          }
        },
        animation: { duration: 1000, easing: 'easeOutQuart' },
        onClick: (e, elements) => {
          if (elements.length) {
            const index = elements[0].index;
            const status = statuses[index];
            const statusAppointments = appointments.filter(app => 
              new Date(app.appointment_date).getFullYear() === year && app.status?.toLowerCase() === status
            );
            Swal.fire({
              title: `${status.capitalize()} Appointments in ${year}`,
              html: statusAppointments.length 
                ? `<ul>${statusAppointments.map(app => `<li>${getPatientName(app.patients)} - ${new Date(app.appointment_date).toLocaleDateString()}</li>`).join('')}</ul>` 
                : 'No appointments found.',
              confirmButtonColor: '#4A90E2'
            });
          }
        }
      }
    });

    const legendContainer = document.getElementById('statusChartLegend');
    legendContainer.innerHTML = '';
    datasets[0].data.forEach((count, index) => {
      const legendItem = document.createElement('div');
      legendItem.className = `legend-item`;
      legendItem.setAttribute('role', 'button');
      legendItem.setAttribute('tabindex', '0');
      legendItem.innerHTML = `
        <span class="legend-color" style="background-color: ${datasets[0].backgroundColor[index]};"></span>
        <span>${statuses[index].capitalize()}</span>
      `;
      legendItem.addEventListener('click', () => {
        const meta = statusChartInstance.getDatasetMeta(0);
        meta.data[index].hidden = !meta.data[index].hidden;
        legendItem.classList.toggle('hidden');
        statusChartInstance.update();
      });
      legendItem.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const meta = statusChartInstance.getDatasetMeta(0);
          meta.data[index].hidden = !meta.data[index].hidden;
          legendItem.classList.toggle('hidden');
          statusChartInstance.update();
        }
      });
      legendContainer.appendChild(legendItem);
    });

    document.getElementById('statusHighlightText').textContent = total > 0 
      ? `Dominant Status: ${dominantStatus.capitalize()} (${maxCount} appointments)`
      : 'No appointment data available.';
  } catch (error) {
    console.error('Error rendering pie chart:', error);
    Swal.fire({
      icon: 'error',
      title: 'Graph Error',
      text: `Failed to render status chart: ${error.message}`,
      confirmButtonColor: '#4A90E2'
    });
  }
  spinner.style.display = 'none';
}

function renderServiceChart(appointments, services, year) {
  const spinner = document.getElementById('barChartSpinner');
  spinner.style.display = 'block';
  try {
    const canvas = document.getElementById('serviceChart');
    if (!canvas || !canvas.getContext('2d')) throw new Error('Canvas context not available');
    const serviceCounts = services.map((service, index) => ({
      name: service.name,
      count: appointments.filter(app => new Date(app.appointment_date).getFullYear() === year && app.services?.name === service.name).length,
      color: generateColor(index)
    }));

    const datasets = [{
      label: 'Appointments',
      data: serviceCounts.map(s => s.count),
      backgroundColor: serviceCounts.map(s => s.color),
      borderColor: serviceCounts.map(s => s.color),
      borderWidth: 1
    }];

    const maxCount = Math.max(...serviceCounts.map(s => s.count));
    const topService = serviceCounts.find(s => s.count === maxCount)?.name || 'N/A';

    if (serviceChartInstance) serviceChartInstance.destroy();
    serviceChartInstance = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: { labels: services.map(s => s.name), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            title: { 
              display: true, 
              text: 'Number of Appointments', 
              font: { size: 14, weight: '600', family: 'Nunito' }, 
              color: '#333' 
            },
            ticks: { stepSize: 1, font: { size: 12, family: 'Nunito' }, color: '#666' }
          },
          x: {
            title: { 
              display: true, 
              text: 'Service', 
              font: { size: 14, weight: '600', family: 'Nunito' }, 
              color: '#333' 
            },
            ticks: { font: { size: 12, family: 'Nunito' }, color: '#666' }
          }
        },
        plugins: {
          legend: { display: false },
          title: { 
            display: true, 
            text: `Service Popularity (${year})`, 
            font: { size: 18, weight: '600', family: 'Nunito' }, 
            color: '#333', 
            padding: { top: 10, bottom: 20 } 
          },
          tooltip: { 
            backgroundColor: '#fff', 
            titleColor: '#333', 
            bodyColor: '#666', 
            borderColor: '#e0e0e0', 
            borderWidth: 1, 
            cornerRadius: 8, 
            padding: 12 
          }
        },
        animation: { duration: 1000, easing: 'easeOutQuart' },
        onClick: (e, elements) => {
          if (elements.length) {
            const index = elements[0].index;
            const service = services[index].name;
            const serviceAppointments = appointments.filter(app => 
              new Date(app.appointment_date).getFullYear() === year && app.services?.name === service
            );
            Swal.fire({
              title: `${service} Appointments in ${year}`,
              html: serviceAppointments.length 
                ? `<ul>${serviceAppointments.map(app => `<li>${getPatientName(app.patients)} - ${new Date(app.appointment_date).toLocaleDateString()}</li>`).join('')}</ul>` 
                : 'No appointments found.',
              confirmButtonColor: '#4A90E2'
            });
          }
        }
      }
    });

    const legendContainer = document.getElementById('serviceChartLegend');
    legendContainer.innerHTML = '';
    datasets[0].data.forEach((count, index) => {
      const legendItem = document.createElement('div');
      legendItem.className = `legend-item`;
      legendItem.setAttribute('role', 'button');
      legendItem.setAttribute('tabindex', '0');
      legendItem.innerHTML = `
        <span class="legend-color" style="background-color: ${datasets[0].backgroundColor[index]};"></span>
        <span>${services[index].name}</span>
      `;
      legendItem.addEventListener('click', () => {
        const meta = serviceChartInstance.getDatasetMeta(0);
        meta.data[index].hidden = !meta.data[index].hidden;
        legendItem.classList.toggle('hidden');
        serviceChartInstance.update();
      });
      legendItem.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const meta = serviceChartInstance.getDatasetMeta(0);
          meta.data[index].hidden = !meta.data[index].hidden;
          legendItem.classList.toggle('hidden');
          serviceChartInstance.update();
        }
      });
      legendContainer.appendChild(legendItem);
    });

    document.getElementById('serviceHighlightText').textContent = maxCount > 0 
      ? `Most Popular Service: ${topService} (${maxCount} appointments)`
      : 'No appointment data available.';
  } catch (error) {
    console.error('Error rendering bar chart:', error);
    Swal.fire({
      icon: 'error',
      title: 'Graph Error',
      text: `Failed to render service chart: ${error.message}`,
      confirmButtonColor: '#4A90E2'
    });
  }
  spinner.style.display = 'none';
}

function exportStatusToCsv(appointments, year) {
  const statuses = ['confirmed', 'pending', 'cancelled', 'rejected'];
  const statusCounts = statuses.map(status => ({
    status,
    count: appointments.filter(app => new Date(app.appointment_date).getFullYear() === year && app.status?.toLowerCase() === status).length
  }));
  const csvRows = [['Status', 'Count'].join(',')];
  statusCounts.forEach(s => {
    csvRows.push([s.status.capitalize(), s.count].join(','));
  });
  const csvContent = csvRows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `appointment_status_${year}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  Swal.fire({
    icon: 'success',
    title: 'Export Successful',
    text: `Status data exported as appointment_status_${year}.csv`,
    confirmButtonColor: '#4A90E2',
    timer: 1500
  });
}
