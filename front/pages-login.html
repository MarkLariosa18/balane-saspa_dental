<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Balane-Saspa Dental Clinic</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #d3cce3 100%);
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(132, 84, 140, 0.2);
      background: #fff;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card-body {
      padding: 2rem;
    }
    .btn-primary {
      background: #84548c;
      border: none;
      border-radius: 25px;
      padding: 12px;
      transition: background 0.3s ease;
      font-weight: 500;
    }
    .btn-primary:hover {
      background: #6b4371;
    }
    .form-control {
      border-radius: 10px;
      border: 1px solid #d3cce3;
      padding: 12px;
      transition: border-color 0.3s ease;
    }
    .form-control:focus {
      border-color: #84548c;
      box-shadow: 0 0 0 0.2rem rgba(132, 84, 140, 0.25);
    }
    .input-group-text {
      background: #84548c;
      color: #fff;
      border-radius: 10px 0 0 10px;
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
    .logo img {
      max-width: 60px;
      margin-right: 10px;
    }
    .logo span {
      color: #84548c;
      font-weight: 700;
      font-size: 1.5rem;
    }
    .credits a {
      color: #84548c;
      text-decoration: none;
      font-weight: 500;
    }
    .credits a:hover {
      text-decoration: underline;
    }
    .small a {
      color: #84548c;
      font-weight: 500;
    }
    .small a:hover {
      text-decoration: underline;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }
    #loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #84548c;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div id="loading-spinner"></div>
  </div>

  <main>
    <div class="container">
      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">
              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.png" alt="">
                  <span class="d-none d-lg-block">Balane-Saspa Dental Clinic</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">
                <div class="card-body">
                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Login to Your Account</h5>
                    <p class="text-center small">Enter your username or email & password to login</p>
                  </div>

                  <form id="loginForm" class="row g-3 needs-validation" novalidate>
                    <div class="col-12">
                      <label for="yourIdentifier" class="form-label">Username or Email</label>
                      <div class="input-group has-validation">
                        <span class="input-group-text" id="inputGroupPrepend"><i class="bi bi-person"></i></span>
                        <input type="text" name="identifier" class="form-control" id="yourIdentifier" required>
                        <div class="invalid-feedback">Please enter your username or email.</div>
                      </div>
                    </div>

                    <div class="col-12">
                      <label for="yourPassword" class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" id="yourPassword" required>
                      <div class="invalid-feedback">Please enter your password!</div>
                    </div>

                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit" id="loginButton">Login</button>
                    </div>
                    <div class="col-12">
                      <p class="small mb-0">Don't have an account? <a href="pages-register.html">Create an account</a></p>
                      <p class="small mb-0"><a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
                    </div>
                  </form>
                </div>
              </div>

              <div class="credits">
                Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main><!-- End #main -->

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

  <!-- Inline Script -->
  <script>
    (async () => {
      // Ensure SweetAlert2 is loaded
      if (typeof Swal === 'undefined') {
        console.error('SweetAlert2 failed to load from CDN.');
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'assets/vendor/sweetalert2/sweetalert2.all.min.js';
            script.onload = resolve;
            script.onerror = () => reject(new Error('Failed to load SweetAlert2 fallback'));
            document.head.appendChild(script);
          });
        } catch (error) {
          console.error('SweetAlert2 fallback failed:', error);
          alert('Error: SweetAlert2 failed to load. Please check your internet connection or ensure assets/vendor/sweetalert2/sweetalert2.all.min.js exists.');
          return;
        }
      }
      console.log('SweetAlert2 loaded:', typeof Swal !== 'undefined');

      // Configuration
      const API_BASE_URL = 'https://balane-saspa-dental-1.onrender.com/auth';
      const MAX_ATTEMPTS = 5;
      const LOCKOUT_TIME = 15 * 60 * 1000; // 15 minutes in milliseconds

      // Utility functions
      const showLoading = () => {
        console.log('Showing loading overlay');
        document.getElementById('loading-overlay').style.display = 'flex';
        document.getElementById('loginButton').disabled = true;
      };

      const hideLoading = () => {
        console.log('Hiding loading overlay');
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('loginButton').disabled = false;
      };

      const showAlert = (title, text, icon = 'info') => {
        hideLoading();
        console.log(`Showing alert: ${title} - ${text} (${icon})`);
        return Swal.fire({
          title,
          text,
          icon,
          confirmButtonColor: '#84548c',
          confirmButtonText: 'OK',
          customClass: {
            popup: 'swal2-modern'
          }
        });
      };

      // Validate email or username format
      const isValidIdentifier = (identifier) => {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const usernameRegex = /^[a-zA-Z0-9_]{3,50}$/;
        return emailRegex.test(identifier) || usernameRegex.test(identifier);
      };

      // DOM elements
      const identifierField = document.getElementById('yourIdentifier');
      const passwordField = document.getElementById('yourPassword');
      const rememberMeCheckbox = document.getElementById('rememberMe');
      const form = document.getElementById('loginForm');
      const loginButton = document.getElementById('loginButton');
      const forgotPasswordLink = document.getElementById('forgotPasswordLink');

      if (!forgotPasswordLink) {
        console.error('Forgot Password Link not found in DOM');
        await showAlert('Error', 'Page initialization failed. Please refresh the page.', 'error');
        return;
      }

      // Fetch CSRF token
      let csrfToken = null;
      try {
        showLoading();
        console.log('Fetching CSRF token...');
        const response = await fetch(`${API_BASE_URL}/csrf-token`, {
          method: 'GET',
          credentials: 'include'
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        if (result.csrfToken) {
          csrfToken = result.csrfToken;
          console.log('CSRF token fetched:', csrfToken);
        } else {
          throw new Error('No CSRF token received');
        }
      } catch (error) {
        console.error('Failed to fetch CSRF token:', error);
        await showAlert('Error', 'Failed to initialize login. Please refresh the page.', 'error');
        return;
      } finally {
        hideLoading();
      }

      // Login attempt limiter
      let loginAttempts = parseInt(localStorage.getItem('loginAttempts')) || 0;
      let lockoutUntil = parseInt(localStorage.getItem('lockoutUntil')) || 0;

      const checkLockout = () => {
        const now = Date.now();
        if (loginAttempts >= MAX_ATTEMPTS && now < lockoutUntil) {
          const remainingTime = Math.ceil((lockoutUntil - now) / 1000 / 60);
          console.log(`Lockout active: ${remainingTime} minutes remaining`);
          showAlert('Too Many Attempts', `Please wait ${remainingTime} minute(s) before trying again.`, 'error');
          loginButton.disabled = true;
          return true;
        }
        if (now >= lockoutUntil) {
          loginAttempts = 0;
          localStorage.setItem('loginAttempts', 0);
          localStorage.removeItem('lockoutUntil');
          loginButton.disabled = false;
          console.log('Lockout cleared');
        }
        return false;
      };

      // Attempt auto-login with remember token
      try {
        showLoading();
        console.log('Attempting auto-login...');
        const response = await fetch(`${API_BASE_URL}/auto-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'CSRF-Token': csrfToken
          },
          credentials: 'include'
        });
        const result = await response.json();

        if (result.success) {
          console.log('Auto-login successful:', result);
          await showAlert('Auto-Login Successful', 'Redirecting to your dashboard...', 'success');
          if (result.role === 'admin') {
            console.log('Redirecting to /admin/index.html');
            window.location.href = '/admin/index.html';
          } else {
            console.log('Redirecting to /profile.html');
            window.location.href = '/profile.html';
          }
          return;
        } else {
          console.log('Auto-login failed:', result.message);
        }
      } catch (error) {
        console.log('Auto-login error:', error);
      } finally {
        hideLoading();
      }

      // Manual login form submission
      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (checkLockout()) return;

        const identifier = identifierField.value.trim();
        const password = passwordField.value;
        const remember = rememberMeCheckbox.checked;

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          console.log('Form validation failed');
          return;
        }

        if (!isValidIdentifier(identifier)) {
          console.log('Invalid identifier format:', identifier);
          await showAlert('Invalid Input', 'Please enter a valid username (3-50 alphanumeric characters or underscore) or email address.', 'error');
          return;
        }

        try {
          showLoading();
          loginButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
          console.log('Sending login request:', { identifier, remember });

          const response = await fetch(`${API_BASE_URL}/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'CSRF-Token': csrfToken
            },
            body: JSON.stringify({ identifier, password, remember }),
            credentials: 'include'
          });

          const result = await response.json();
          console.log('Login response:', response.status, result);

          if (!response.ok) {
            loginAttempts++;
            localStorage.setItem('loginAttempts', loginAttempts);
            console.log(`Login attempt failed (${loginAttempts}/${MAX_ATTEMPTS})`);
            if (loginAttempts >= MAX_ATTEMPTS) {
              lockoutUntil = Date.now() + LOCKOUT_TIME;
              localStorage.setItem('lockoutUntil', lockoutUntil);
              checkLockout();
              return;
            }
            if (result.error === 'invalid_csrf_token') {
              console.log('CSRF token invalid');
              await showAlert('Session Error', 'Invalid session. Please refresh the page.', 'error');
            } else if (result.error === 'too_many_requests') {
              console.log('Too many requests');
              await showAlert('Too Many Attempts', result.message, 'error');
            } else {
              console.log('Login error:', result.message);
              await showAlert('Login Failed', result.message || 'Invalid username/email or password', 'error');
            }
            loginButton.innerHTML = 'Login';
            return;
          }

          if (result.success) {
            localStorage.setItem('loginAttempts', 0);
            localStorage.removeItem('lockoutUntil');
            console.log('Login successful:', result);
            await showAlert('Login Successful', 'Redirecting to your dashboard...', 'success');
            if (result.role === 'admin') {
              console.log('Redirecting to /admin/index.html');
              window.location.href = '/admin/index.html';
            } else if (result.role === 'patient') {
              console.log('Redirecting to /profile.html');
              window.location.href = '/profile.html';
            } else {
              console.warn('Unexpected role:', result.role);
              console.log('Falling back to /profile.html');
              window.location.href = '/profile.html';
            }
          } else {
            console.log('Login failed: success flag not set', result);
            await showAlert('Login Failed', result.message || 'Unexpected response from server', 'error');
            loginButton.innerHTML = 'Login';
          }
        } catch (error) {
          console.error('Login error:', error);
          loginAttempts++;
          localStorage.setItem('loginAttempts', loginAttempts);
          console.log(`Login attempt failed (${loginAttempts}/${MAX_ATTEMPTS})`);
          if (loginAttempts >= MAX_ATTEMPTS) {
            lockoutUntil = Date.now() + LOCKOUT_TIME;
            localStorage.setItem('lockoutUntil', lockoutUntil);
            checkLockout();
          }
          await showAlert('Server Error', 'Failed to connect to the server. Please try again later.', 'error');
          loginButton.innerHTML = 'Login';
        } finally {
          hideLoading();
        }
      });

      // Forgot password functionality
      forgotPasswordLink.addEventListener('click', async (event) => {
        event.preventDefault();
        console.log('Forgot password link clicked');

        const { value: identifier } = await Swal.fire({
          title: 'Forgot Password',
          text: 'Enter your email or username to receive an OTP',
          input: 'text',
          inputPlaceholder: 'Email or Username',
          showCancelButton: true,
          confirmButtonColor: '#84548c',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Send OTP',
          inputValidator: (value) => {
            if (!value) {
              return 'Please enter your email or username';
            }
            if (!isValidIdentifier(value)) {
              return 'Please enter a valid username (3-50 alphanumeric characters or underscore) or email address';
            }
            return null;
          }
        });

        if (!identifier) return;

        try {
          showLoading();
          console.log('Sending forgot password request:', { identifier });
          const response = await fetch(`${API_BASE_URL}/forgot-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'CSRF-Token': csrfToken
            },
            body: JSON.stringify({ identifier }),
            credentials: 'include'
          });

          const result = await response.json();
          console.log('Forgot password response:', response.status, result);

          if (!response.ok) {
            if (result.error === 'invalid_csrf_token') {
              console.log('CSRF token invalid');
              await showAlert('Session Error', 'Invalid session. Please refresh the page.', 'error');
            } else if (result.error === 'too_many_requests') {
              console.log('Too many requests');
              await showAlert('Too Many Requests', result.message, 'error');
            } else {
              console.log('Forgot password error:', result.message);
              await showAlert('Error', result.message || 'Failed to send OTP', 'error');
            }
            return;
          }

          await showAlert('OTP Sent', 'An OTP has been sent to your email.', 'success');

          const { value: otp } = await Swal.fire({
            title: 'Enter OTP',
            text: 'Check your email for the 6-digit OTP',
            input: 'text',
            inputPlaceholder: '6-digit OTP',
            showCancelButton: true,
            confirmButtonColor: '#84548c',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Verify OTP',
            inputValidator: (value) => {
              if (!value || value.length !== 6 || !/^\d{6}$/.test(value)) {
                return 'Please enter a valid 6-digit OTP';
              }
              return null;
            }
          });

          if (!otp) return;

          console.log('Sending OTP verification request:', { identifier, otp });
          const verifyResponse = await fetch(`${API_BASE_URL}/verify-otp`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'CSRF-Token': csrfToken
            },
            body: JSON.stringify({ identifier, otp, purpose: 'password_reset' }),
            credentials: 'include'
          });

          const verifyResult = await verifyResponse.json();
          console.log('OTP verification response:', verifyResponse.status, verifyResult);

          if (!verifyResponse.ok) {
            if (verifyResult.error === 'invalid_csrf_token') {
              console.log('CSRF token invalid');
              await showAlert('Session Error', 'Invalid session. Please refresh the page.', 'error');
            } else {
              console.log('OTP verification error:', verifyResult.message);
              await showAlert('Error', verifyResult.message || 'Invalid OTP', 'error');
            }
            return;
          }

          const { value: passwords } = await Swal.fire({
            title: 'Reset Password',
            html: `
              <input type="password" id="newPassword" class="swal2-input" placeholder="New Password">
              <input type="password" id="confirmPassword" class="swal2-input" placeholder="Confirm Password">
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonColor: '#84548c',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Reset Password',
            preConfirm: () => {
              const newPassword = document.getElementById('newPassword').value;
              const confirmPassword = document.getElementById('confirmPassword').value;
              if (!newPassword || newPassword.length < 8 || newPassword.length > 100) {
                Swal.showValidationMessage('Password must be between 8 and 100 characters');
                return false;
              }
              if (newPassword !== confirmPassword) {
                Swal.showValidationMessage('Passwords do not match');
                return false;
              }
              return { newPassword };
            }
          });

          if (!passwords) return;

          console.log('Sending password reset request:', { identifier, otp });
          const resetResponse = await fetch(`${API_BASE_URL}/reset-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'CSRF-Token': csrfToken
            },
            body: JSON.stringify({ identifier, otp, newPassword: passwords.newPassword }),
            credentials: 'include'
          });

          const resetResult = await resetResponse.json();
          console.log('Password reset response:', resetResponse.status, resetResult);

          if (!resetResponse.ok) {
            if (resetResult.error === 'invalid_csrf_token') {
              console.log('CSRF token invalid');
              await showAlert('Session Error', 'Invalid session. Please refresh the page.', 'error');
            } else {
              console.log('Password reset error:', resetResult.message);
              await showAlert('Error', resetResult.message || 'Failed to reset password', 'error');
            }
            return;
          }

          await showAlert('Success', 'Your password has been reset. Please log in.', 'success');
          window.location.reload();
        } catch (error) {
          console.error('Forgot password error:', error);
          await showAlert('Server Error', 'Failed to connect to the server. Please try again later.', 'error');
        } finally {
          hideLoading();
        }
      });
    })();
  </script>
</body>

</html>
