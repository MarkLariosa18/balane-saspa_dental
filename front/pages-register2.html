<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Patient Registration</title>
  <meta content="Patient registration form for dental clinic" name="description">
  <meta content="dental, patient, registration" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/sweetalert2/sweetalert2.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #d3cce3 100%);
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(132, 84, 140, 0.2);
      background: #fff;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card-body {
      padding: 2rem;
    }
    .btn-primary, #sendOtpButton, #verifyOtpButton {
      background: #84548c;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      transition: background 0.3s ease;
      font-weight: 500;
    }
    .btn-primary:hover, #sendOtpButton:hover, #verifyOtpButton:hover {
      background: #6b4371;
    }
    .btn-success {
      background: #28a745 !important;
      border-color: #28a745 !important;
    }
    .btn-secondary {
      background: #6c757d !important;
      border-color: #6c757d !important;
    }
    .form-control, textarea.form-control {
      border-radius: 10px;
      border: 1px solid #d3cce3;
      padding: 12px;
      transition: border-color 0.3s ease;
    }
    .form-control:focus, textarea.form-control:focus {
      border-color: #84548c;
      box-shadow: 0 0 0 0.2rem rgba(132, 84, 140, 0.25);
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
    .logo img {
      max-width: 60px;
      margin-right: 10px;
    }
    .logo span {
      color: #84548c;
      font-weight: 700;
      font-size: 1.5rem;
    }
    .login-link a {
      color: #84548c;
      text-decoration: none;
      font-weight: 500;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .section-divider {
      background-color: #f8f9fa;
      border-radius: 5px;
      padding: 10px 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .section-divider h5 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
    }
    .account-info {
      background-color: #f8f9fa;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .account-info h6 {
      font-weight: 600;
      color: #333;
    }
    .account-info .username {
      color: #84548c;
      font-weight: bold;
    }
    .field-error {
      color: #dc3545;
      font-size: 0.85em;
      margin-top: 0.25rem;
    }
    .text-success.field-error {
      color: #198754;
    }
    .is-invalid {
      border: 2px solid #dc3545 !important;
      background-color: #f8d7da;
    }
    .is-valid {
      border: 2px solid #198754 !important;
      background-color: #d1e7dd;
    }
    .optional-label {
      color: #6c757d;
      font-size: 0.85em;
      margin-left: 5px;
    }
    .otp-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .otp-container input {
      flex-grow: 1;
    }
    .verify-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #otpTimer {
      font-size: 0.9em;
      color: #6c757d;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }
    #loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #84548c;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      .form-check-inline {
        display: block;
        margin-bottom: 0.5rem;
      }
      .card {
        margin: 0 10px;
      }
      .col-lg-8.col-md-10 {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-spinner"></div>
  </div>

  <main>
    <div class="container">
      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 d-flex flex-column align-items-center justify-content-center">
              <div class="d-flex justify-content-center py-4">
                <a href="index.html" class="logo d-flex align-items-center w-auto">
                  <img src="assets/img/logo.png" alt="">
                  <span class="d-none d-lg-block">Balane-Saspa Dental Clinic</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3">
                <div class="card-body">
                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Patient Registration Form</h5>
                    <p class="text-center small">Step 2 of 2: Enter your personal information</p>
                  </div>

                  <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

                  <!-- Account Information Summary -->
                  <div id="accountInfo" class="account-info">
                    <h6 class="mb-2">Account Information:</h6>
                    <p>Username: <span id="accountUsername" class="username"></span></p>
                    <p><small class="text-muted">Password: ••••••••</small></p>
                  </div>

                  <form id="patientForm" class="row g-3 needs-validation" novalidate>
                    <!-- Personal Information -->
                    <div class="col-12 section-divider">
                      <h5>Personal Information</h5>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="lastName" class="form-label">Last Name *</label>
                      <input type="text" class="form-control" id="lastName" required>
                      <div id="lastNameError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="firstName" class="form-label">First Name *</label>
                      <input type="text" class="form-control" id="firstName" required>
                      <div id="firstNameError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="middleName" class="form-label">Middle Name <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="middleName">
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="birthdate" class="form-label">Birthdate *</label>
                      <input type="date" class="form-control" id="birthdate" required>
                      <div id="birthdateError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label class="form-label d-block">Sex *</label>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="sex" id="sexMale" value="M" required>
                        <label class="form-check-label" for="sexMale">Male</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="sex" id="sexFemale" value="F" required>
                        <label class="form-check-label" for="sexFemale">Female</label>
                      </div>
                      <div id="sexError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="nickname" class="form-label">Nickname <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="nickname">
                    </div>

                    <div class="col-md-6 col-sm-12">
                      <label for="religion" class="form-label">Religion <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="religion">
                    </div>

                    <div class="col-md-6 col-sm-12">
                      <label for="nationality" class="form-label">Nationality <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="nationality">
                    </div>

                    <!-- Contact Information -->
                    <div class="col-12 section-divider">
                      <h5>Contact Information</h5>
                    </div>

                    <div class="col-12">
                      <label for="homeAddress" class="form-label">Home Address *</label>
                      <textarea class="form-control" id="homeAddress" rows="2" required></textarea>
                      <div id="homeAddressError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="homeNo" class="form-label">Home No. <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="homeNo">
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="mobileNo" class="form-label">Mobile No. *</label>
                      <input type="text" class="form-control" id="mobileNo" required>
                      <div id="mobileNoError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="email" class="form-label">Email *</label>
                      <input type="email" class="form-control" id="email" required>
                      <div id="emailError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="occupation" class="form-label">Occupation <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="occupation">
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="officeNo" class="form-label">Office No. <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="officeNo">
                    </div>

                    <div class="col-md-4 col-sm-12">
                      <label for="faxNo" class="form-label">Fax No. <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="faxNo">
                    </div>

                    <div class="col-md-12 col-sm-12">
                      <label for="dentalInsurance" class="form-label">Dental Insurance <span class="optional-label">(Optional)</span></label>
                      <input type="text" class="form-control" id="dentalInsurance">
                    </div>

                    <div class="col-12">
                      <label for="otp" class="form-label">OTP Verification *</label>
                      <div class="otp-container">
                        <input type="text" class="form-control" id="otp" placeholder="Enter OTP sent to your email" required>
                        <button id="sendOtpButton" class="btn btn-secondary">Send OTP</button>
                      </div>
                      <div class="mt-2 verify-container">
                        <button id="verifyOtpButton" class="btn btn-primary">Verify OTP</button>
                        <span id="otpTimer"></span>
                      </div>
                      <div id="otpError" class="field-error" style="display: none;"></div>
                    </div>

                    <div class="col-12 text-center">
                      <button id="registerButton" type="submit" class="btn btn-primary w-100">Register Patient</button>
                    </div>

                    <!-- Login Link -->
                    <div class="login-link">
                      <p>Already have an account? <a href="pages-login.html"><i class="bi bi-box-arrow-in-right"></i> Login here</a></p>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    if (typeof Swal === 'undefined') {
      document.write('<script src="assets/vendor/sweetalert2/sweetalert2.min.js"><\/script>');
    }
  </script>

  <!-- Form Handling Script -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("patientForm");
      const errorMessage = document.getElementById("errorMessage");
      const otpButton = document.getElementById("sendOtpButton");
      const accountInfoDiv = document.getElementById("accountInfo");
      const accountUsername = document.getElementById("accountUsername");
      const verifyOtpButton = document.getElementById("verifyOtpButton");
      const registerButton = document.getElementById("registerButton");
      const otpTimerDisplay = document.getElementById("otpTimer");
      let otpVerified = false;
      let otpSent = false;
      let otpTimerInterval = null;
      let csrfToken = null;

      // Fetch CSRF token
      try {
        const response = await fetch('https://balane-saspa-dental-1.onrender.com/auth/csrf-token', {
          method: 'GET',
          credentials: 'include'
        });
        const result = await response.json();
        if (result.csrfToken) {
          csrfToken = result.csrfToken;
        } else {
          throw new Error('No CSRF token received');
        }
      } catch (error) {
        console.error('Failed to fetch CSRF token:', error);
        await showAlert('Error', 'Failed to initialize form. Please refresh the page.', 'error');
        return;
      }

      // Utility functions
      const showLoading = () => {
        document.getElementById('loading-overlay').style.display = 'flex';
        if (otpButton) otpButton.disabled = true;
        if (verifyOtpButton) verifyOtpButton.disabled = true;
        if (registerButton) registerButton.disabled = true;
      };
      const hideLoading = () => {
        document.getElementById('loading-overlay').style.display = 'none';
        if (otpButton && !otpButton.classList.contains('btn-success')) otpButton.disabled = false;
        if (verifyOtpButton && otpSent) verifyOtpButton.disabled = false;
        if (registerButton && otpVerified) registerButton.disabled = false;
      };
      const showAlert = (title, text, icon = 'info') => {
        hideLoading();
        return Swal.fire({
          title,
          text,
          icon,
          confirmButtonColor: '#84548c',
          confirmButtonText: 'OK',
          customClass: { popup: 'swal2-modern' }
        });
      };
      const showFieldError = (fieldId, message) => {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const errorElement = document.getElementById(`${fieldId}Error`);
        if (errorElement) {
          errorElement.textContent = message;
          errorElement.style.display = "block";
        }
        field.classList.add("is-invalid");
      };
      const clearFieldError = (fieldId) => {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const errorElement = document.getElementById(`${fieldId}Error`);
        if (errorElement) {
          errorElement.textContent = "";
          errorElement.style.display = "none";
        }
        field.classList.remove("is-invalid");
        field.classList.remove("is-valid");
      };
      const showFieldSuccess = (fieldId, message) => {
        const element = document.getElementById(fieldId);
        if (!element) return;
        element.classList.remove("is-invalid");
        element.classList.add("is-valid");
        const errorElement = document.getElementById(`${fieldId}Error`);
        if (errorElement) {
          errorElement.textContent = message;
          errorElement.style.display = "block";
          errorElement.className = "text-success field-error";
        }
      };

      // Check account data
      const accountData = JSON.parse(sessionStorage.getItem('accountData') || '{}');
      if (!accountData.username) {
        await showAlert("Missing Information", "Please complete the account creation step first.", "warning");
        window.location.href = "pages-register.html";
        return;
      }
      if (accountUsername) {
        accountUsername.textContent = accountData.username;
      }

      if (!form) {
        console.error("Form not found!");
        return;
      }
      if (registerButton) {
        registerButton.disabled = true;
      }
      if (verifyOtpButton) {
        verifyOtpButton.disabled = true;
      }

      // Clear errors on input
      const inputFields = form.querySelectorAll("input, textarea");
      inputFields.forEach(field => {
        if (field && field.id) {
          field.addEventListener("input", () => {
            clearFieldError(field.id);
            errorMessage.style.display = "none";
          });
        }
      });

      // OTP timer
      const startOTPTimer = (durationInSeconds) => {
        clearInterval(otpTimerInterval);
        let timeLeft = durationInSeconds;
        const expiryTime = Date.now() + durationInSeconds * 1000;
        sessionStorage.setItem("otpExpiryTime", expiryTime.toString());

        if (otpButton) {
          otpButton.textContent = "Resend OTP";
          otpButton.classList.remove("btn-secondary");
          otpButton.classList.add("btn-success");
        }

        otpTimerInterval = setInterval(() => {
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          if (otpTimerDisplay) {
            otpTimerDisplay.textContent = `(Expires in ${minutes}:${seconds < 10 ? '0' : ''}${seconds})`;
          }
          if (timeLeft <= 0) {
            clearInterval(otpTimerInterval);
            if (otpTimerDisplay) otpTimerDisplay.textContent = "(OTP expired)";
            if (otpButton) {
              otpButton.disabled = false;
              otpButton.classList.remove("btn-success");
              otpButton.classList.add("btn-secondary");
            }
            sessionStorage.removeItem("otpExpiryTime");
          }
          timeLeft--;
        }, 1000);
      };

      // Restore OTP timer
      const storedExpiryTime = sessionStorage.getItem("otpExpiryTime");
      if (storedExpiryTime) {
        const timeLeft = Math.max(0, Math.floor((parseInt(storedExpiryTime) - Date.now()) / 1000));
        if (timeLeft > 0) {
          otpSent = true;
          if (verifyOtpButton) verifyOtpButton.disabled = false;
          if (otpButton) {
            otpButton.textContent = "Resend OTP";
            otpButton.classList.remove("btn-secondary");
            otpButton.classList.add("btn-success");
          }
          startOTPTimer(timeLeft);
        } else {
          sessionStorage.removeItem("otpExpiryTime");
          if (otpTimerDisplay) otpTimerDisplay.textContent = "(OTP expired)";
          if (otpButton) {
            otpButton.disabled = false;
            otpButton.textContent = "Resend OTP";
            otpButton.classList.remove("btn-success");
            otpButton.classList.add("btn-secondary");
          }
        }
      }

      // Send OTP
      if (otpButton) {
        otpButton.addEventListener("click", async (event) => {
          event.preventDefault();
          showLoading();

          const emailField = document.getElementById("email");
          if (!emailField) {
            hideLoading();
            return;
          }
          const email = emailField.value.trim().toLowerCase();

          if (!email) {
            showFieldError("email", "Please enter an email address to send OTP");
            hideLoading();
            return;
          }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showFieldError("email", "Please enter a valid email address");
            hideLoading();
            return;
          }

          otpButton.disabled = true;
          otpButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';

          try {
            const timeoutPromise = new Promise((_, reject) => {
              setTimeout(() => reject(new Error("Request timed out. Please try again.")), 10000);
            });
            const fetchPromise = fetch("https://balane-saspa-dental-1.onrender.com/api/send-otp", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRF-Token": csrfToken
              },
              body: JSON.stringify({ email }),
              credentials: 'include'
            });
            const response = await Promise.race([fetchPromise, timeoutPromise]);
            const result = await response.json();

            if (!response.ok || !result.success) {
              const errorMessages = {
                email_exists: "Email already exists. Please use another email or login.",
                too_many_requests: "Too many OTP requests. Please try again in 15 minutes.",
                missing_fields: "Please provide an email address.",
                server_error: "Server error when sending OTP. Please try again."
              };
              const message = errorMessages[result.error] || result.message || "Failed to send OTP.";
              showFieldError("email", message);
              await showAlert(result.error === "email_exists" ? "Email Exists" : "Error", message, "error");
              return;
            }

            otpSent = true;
            if (verifyOtpButton) verifyOtpButton.disabled = false;
            await showAlert("OTP Sent", "OTP sent successfully! Please check your email.", "success");
            startOTPTimer(900);
          } catch (error) {
            console.error("Error sending OTP:", error);
            showFieldError("email", error.message || "Server error when sending OTP.");
            await showAlert("Error", error.message || "Server error when sending OTP.", "error");
          } finally {
            otpButton.disabled = false;
            otpButton.textContent = otpSent ? "Resend OTP" : "Send OTP";
            if (!otpSent) {
              otpButton.classList.remove("btn-success");
              otpButton.classList.add("btn-secondary");
            }
            hideLoading();
          }
        });
      }

      // Verify OTP
      if (verifyOtpButton) {
        verifyOtpButton.addEventListener("click", async (event) => {
          event.preventDefault();
          showLoading();

          if (!otpSent) {
            showFieldError("otp", "Please send an OTP before verifying.");
            await showAlert("Action Required", "Please send an OTP before verifying.", "warning");
            hideLoading();
            return;
          }

          const emailField = document.getElementById("email");
          const otpField = document.getElementById("otp");
          if (!emailField || !otpField) {
            hideLoading();
            return;
          }

          const email = emailField.value.trim().toLowerCase();
          const otp = otpField.value.trim();
          const purpose = "signup";

          if (!otp) {
            showFieldError("otp", "Please enter the OTP sent to your email");
            await showAlert("Missing OTP", "Please enter the OTP sent to your email.", "warning");
            hideLoading();
            return;
          }

          verifyOtpButton.disabled = true;
          verifyOtpButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Verifying...';

          try {
            const timeoutPromise = new Promise((_, reject) => {
              setTimeout(() => reject(new Error("Request timed out. Please try again.")), 10000);
            });
            const fetchPromise = fetch("https://balane-saspa-dental-1.onrender.com/api/verify-otp", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRF-Token": csrfToken
              },
              body: JSON.stringify({ email, otp, purpose }),
              credentials: 'include'
            });
            const response = await Promise.race([fetchPromise, timeoutPromise]);
            const result = await response.json();

            if (!response.ok || !result.success) {
              const errorMessages = {
                invalid_otp: "The OTP you entered is incorrect. Please try again.",
                expired_otp: "Your OTP has expired. Please request a new one.",
                invalid_purpose: "Invalid OTP purpose. Please request a new OTP for signup.",
                missing_fields: "Please fill in all required fields.",
                server_error: "Server error when verifying OTP. Please try again."
              };
              const message = errorMessages[result.error] || result.message || "Invalid OTP.";
              showFieldError("otp", message);
              await showAlert("Verification Failed", message, "error");
              return;
            }

            otpVerified = true;
            showFieldSuccess("otp", "OTP verified successfully!");
            clearInterval(otpTimerInterval);
            if (otpTimerDisplay) otpTimerDisplay.textContent = "";
            sessionStorage.removeItem("otpExpiryTime");

            otpField.disabled = true;
            verifyOtpButton.disabled = true;
            verifyOtpButton.innerHTML = '<i class="bi bi-check-circle-fill"></i> Verified';
            verifyOtpButton.classList.remove("btn-primary");
            verifyOtpButton.classList.add("btn-success");

            if (registerButton) {
              registerButton.disabled = false;
              registerButton.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            await showAlert("Success", "OTP verified successfully!", "success");
          } catch (error) {
            console.error("Error verifying OTP:", error);
            showFieldError("otp", error.message || "Server error when verifying OTP.");
            await showAlert("Error", error.message || "Server error when verifying OTP.", "error");
          } finally {
            if (!otpVerified) {
              verifyOtpButton.disabled = false;
              verifyOtpButton.textContent = "Verify OTP";
            }
            hideLoading();
          }
        });
      }

      // Form submission
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showLoading();

        if (!otpVerified) {
          await showAlert("Verification Required", "Please verify your OTP before registering.", "warning");
          hideLoading();
          return;
        }

        errorMessage.style.display = "none";
        const inputs = form.querySelectorAll("input, textarea");
        inputs.forEach(input => {
          if (input) input.classList.remove("is-invalid", "is-valid");
        });
        const fieldErrors = document.querySelectorAll(".field-error");
        fieldErrors.forEach(element => {
          if (element) {
            element.textContent = "";
            element.style.display = "none";
          }
        });

        const lastName = document.getElementById("lastName").value.trim();
        const firstName = document.getElementById("firstName").value.trim();
        const middleName = document.getElementById("middleName").value.trim();
        const birthdate = document.getElementById("birthdate").value;
        const sex = document.querySelector('input[name="sex"]:checked')?.value;
        const nickname = document.getElementById("nickname").value.trim();
        const religion = document.getElementById("religion").value.trim();
        const nationality = document.getElementById("nationality").value.trim();
        const homeAddress = document.getElementById("homeAddress").value.trim();
        const homeNo = document.getElementById("homeNo").value.trim();
        const occupation = document.getElementById("occupation").value.trim();
        const officeNo = document.getElementById("officeNo").value.trim();
        const dentalInsurance = document.getElementById("dentalInsurance").value.trim();
        const faxNo = document.getElementById("faxNo").value.trim();
        const mobileNo = document.getElementById("mobileNo").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();

        let hasError = false;

        // Validation
        const requiredFields = [
          { id: "lastName", label: "Last Name", value: lastName },
          { id: "firstName", label: "First Name", value: firstName },
          { id: "birthdate", label: "Birthdate", value: birthdate },
          { id: "homeAddress", label: "Home Address", value: homeAddress },
          { id: "mobileNo", label: "Mobile Number", value: mobileNo },
          { id: "email", label: "Email", value: email }
        ];
        requiredFields.forEach(field => {
          if (!field.value) {
            showFieldError(field.id, `${field.label} is required`);
            hasError = true;
          }
        });

        if (!sex) {
          showFieldError("sexError", "Please select a gender");
          hasError = true;
        }

        if (lastName && lastName.length > 50) {
          showFieldError("lastName", "Last Name must be 50 characters or less");
          hasError = true;
        }
        if (firstName && firstName.length > 50) {
          showFieldError("firstName", "First Name must be 50 characters or less");
          hasError = true;
        }
        if (middleName && middleName.length > 50) {
          showFieldError("middleName", "Middle Name must be 50 characters or less");
          hasError = true;
        }
        if (nickname && nickname.length > 50) {
          showFieldError("nickname", "Nickname must be 50 characters or less");
          hasError = true;
        }
        if (religion && religion.length > 50) {
          showFieldError("religion", "Religion must be 50 characters or less");
          hasError = true;
        }
        if (nationality && nationality.length > 50) {
          showFieldError("nationality", "Nationality must be 50 characters or less");
          hasError = true;
        }
        if (homeAddress && homeAddress.length > 200) {
          showFieldError("homeAddress", "Home Address must be 200 characters or less");
          hasError = true;
        }
        if (homeNo && homeNo.length > 20) {
          showFieldError("homeNo", "Home Number must be 20 characters or less");
          hasError = true;
        }
        if (occupation && occupation.length > 100) {
          showFieldError("occupation", "Occupation must be 100 characters or less");
          hasError = true;
        }
        if (officeNo && officeNo.length > 20) {
          showFieldError("officeNo", "Office Number must be 20 characters or less");
          hasError = true;
        }
        if (dentalInsurance && dentalInsurance.length > 100) {
          showFieldError("dentalInsurance", "Dental Insurance must be 100 characters or less");
          hasError = true;
        }
        if (faxNo && faxNo.length > 20) {
          showFieldError("faxNo", "Fax Number must be 20 characters or less");
          hasError = true;
        }
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showFieldError("email", "Please enter a valid email address");
          hasError = true;
        }
        if (mobileNo && !/^\+?\d{7,15}$/.test(mobileNo.replace(/[-\s]/g, ''))) {
          showFieldError("mobileNo", "Please enter a valid mobile number (7-15 digits)");
          hasError = true;
        }
        if (birthdate) {
          const date = new Date(birthdate);
          const today = new Date();
          if (isNaN(date.getTime()) || date > today) {
            showFieldError("birthdate", "Please enter a valid past date");
            hasError = true;
          }
        }

        if (hasError) {
          await showAlert("Validation Error", "Please correct the errors and try again.", "error");
          hideLoading();
          return;
        }

        if (registerButton) {
          registerButton.disabled = true;
          registerButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registering...';
        }

        const patientData = {
          username: accountData.username,
          password: accountData.password,
          last_name: lastName,
          first_name: firstName,
          middle_name: middleName || null,
          birthdate,
          sex,
          nickname: nickname || null,
          religion: religion || null,
          nationality: nationality || null,
          home_address: homeAddress,
          home_no: homeNo || null,
          occupation: occupation || null,
          office_no: officeNo || null,
          dental_insurance: dentalInsurance || null,
          fax_no: faxNo || null,
          mobile_no: mobileNo,
          email
        };

        try {
          const timeoutPromise = new Promise((_, reject) => {
            setTimeout(() => reject(new Error("Request timed out. Please try again.")), 10000);
          });
          const fetchPromise = fetch("https://balane-saspa-dental-1.onrender.com/patients", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRF-Token": csrfToken
            },
            body: JSON.stringify(patientData),
            credentials: 'include'
          });
          const response = await Promise.race([fetchPromise, timeoutPromise]);
          const result = await response.json();

          if (!response.ok) {
            const errorMessages = {
              username_exists: "Username already exists. Please choose another username.",
              email_exists: "Email already exists. Please use another email or login.",
              missing_fields: "Please fill out all required fields.",
              invalid_data: result.message || "Invalid data provided.",
              too_many_requests: "Too many registration attempts. Please try again later.",
              server_error: "Server error. Please try again."
            };
            const message = errorMessages[result.error] || result.message || "Failed to register patient.";
            if (result.error === "email_exists") {
              showFieldError("email", message);
            } else if (result.error === "username_exists") {
              await showAlert("Username Exists", message, "error");
            } else {
              await showAlert("Error", message, "error");
            }
            return;
          }

          sessionStorage.removeItem('accountData');
          sessionStorage.removeItem('otpExpiryTime');
          await showAlert("Success", "Registration successful! Redirecting to login page...", "success");

          setTimeout(() => {
            window.location.href = "pages-login.html";
          }, 2000);
        } catch (error) {
          console.error("Error:", error);
          await showAlert("Error", error.message || "Failed to register. Please try again.", "error");
        } finally {
          if (registerButton) {
            registerButton.disabled = false;
            registerButton.innerHTML = 'Register Patient';
          }
          hideLoading();
        }
      });
    });
  </script>
</body>
</html>
